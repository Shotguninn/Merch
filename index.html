```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Scrolling message */
        .announcement {
            width: 100%;
            height: 35px;
            overflow: hidden;
            border-bottom: 1px solid #222;
            white-space: nowrap;
        }

        .announcement-track {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 12s linear infinite;
        }

        .announcement-text {
            display: inline-block;
            font-size: 14px;
            line-height: 35px;
            letter-spacing: 1px;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        header {
            padding: 30px 50px;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 2px;
        }

        .shop {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .product {
            width: 300px;
            background: #0b0b0b;
            border: 1px solid #222;
            padding: 15px;
            transition: 0.2s;
        }

        .product:hover {
            border-color: #555;
            transform: translateY(-4px);
        }

        .product img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            background: #111;
        }

        .product h2 {
            margin-top: 18px;
            font-size: 20px;
        }

        .price {
            margin-top: 8px;
            color: #aaa;
            font-size: 17px;
        }

        .buy {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .buy:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <!-- Moving text -->
    <div class="announcement">
        <div class="announcement-track">
            <span class="announcement-text">
                dont buy this its a waste of money &nbsp;&nbsp;&nbsp;&nbsp;
            </span>
        </div>
    </div>

    <header>
        <h1>merch</h1>
    </header>

    <main class="shop">

        <div class="product">

            <img src="signed-paper.jpg" alt="Signed Paper">

            <h2>Signed Paper</h2>

            <div class="price">€0.10</div>

            <button class="buy">BUY</button>

        </div>

    </main>

</body>
</html>
```

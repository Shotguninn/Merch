<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* ===== MOVING TEXT ===== */

        .announcement {
            width: 100%;
            height: 35px;
            overflow: hidden;
            border-bottom: 1px solid #222;
            white-space: nowrap;
        }

        .announcement-track {
            display: flex;
            width: max-content;
            animation: marquee 14s linear infinite;
        }

        .announcement-text {
            flex-shrink: 0;
            padding-right: 50px;
            font-size: 14px;
            line-height: 35px;
            letter-spacing: 1px;
        }

        @keyframes marquee {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* ===== HEADER ===== */

        header {
            padding: 30px 50px;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 2px;
        }

        /* ===== SHOP ===== */

        .shop {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .product {
            width: 300px;
            background: #0b0b0b;
            border: 1px solid #222;
            padding: 15px;
            transition: 0.2s;
        }

        .product:hover {
            border-color: #555;
            transform: translateY(-4px);
        }

        /* ===== IMAGE HOVER ===== */

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #111;
        }

        /* White corner lines */

        .image-wrapper::before,
        .image-wrapper::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border: 2px solid transparent;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 2;
        }

        .image-wrapper::before {
            top: -5px;
            left: -5px;
        }

        .image-wrapper::after {
            bottom: -5px;
            right: -5px;
        }

        .image-wrapper:hover::before {
            width: 35px;
            height: 35px;
            border-top-color: white;
            border-left-color: white;
        }

        .image-wrapper:hover::after {
            width: 35px;
            height: 35px;
            border-bottom-color: white;
            border-right-color: white;
        }

        .product h2 {
            margin-top: 18px;
            font-size: 20px;
        }

        .price {
            margin-top: 8px;
            color: #aaa;
            font-size: 17px;
        }

        .buy {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .buy:hover {
            background: #ddd;
        }
    </style>
</head>
